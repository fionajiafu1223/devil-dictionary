workflows:
  ios-workflow:
    name: 魔鬼辞典 iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Admin"
    environment:
      groups:
        - devil_dictionary_secrets
      vars:
        BUNDLE_ID: "com.fiona.devildictionary"
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform
        script: |
          npx cap add ios
      - name: Sync Capacitor web assets
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Replace app icon
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          cp assets/icons/AppIcon-1024@1x.png "$ICON_DIR/"
          cp assets/icons/AppIcon-20@2x.png "$ICON_DIR/"
          cp assets/icons/AppIcon-20@3x.png "$ICON_DIR/"
          cp assets/icons/AppIcon-29@2x.png "$ICON_DIR/"
          cp assets/icons/AppIcon-29@3x.png "$ICON_DIR/"
          cp assets/icons/AppIcon-40@2x.png "$ICON_DIR/"
          cp assets/icons/AppIcon-40@3x.png "$ICON_DIR/"
          cp assets/icons/AppIcon-60@2x.png "$ICON_DIR/"
          cp assets/icons/AppIcon-60@3x.png "$ICON_DIR/"
          cp assets/icons/AppIcon-76@1x.png "$ICON_DIR/"
          cp assets/icons/AppIcon-76@2x.png "$ICON_DIR/"
          cp "assets/icons/AppIcon-83.5@2x.png" "$ICON_DIR/"
          cp assets/icons/Contents.json "$ICON_DIR/"
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(date +%s)
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
