workflows:
  ios-workflow:
    name: 魔鬼辞典 iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Admin"
    environment:
      groups:
        - devil_dictionary_secrets
      vars:
        BUNDLE_ID: "com.fiona.devildictionary"
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform and commit if not exists
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
            git config user.email "ci@codemagic.io"
            git config user.name "Codemagic Build Bot"
            git add ios/
            git commit -m "Add iOS platform via Codemagic"
            git push origin main
          fi
      - name: Sync Capacitor web assets
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "ios/App/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
